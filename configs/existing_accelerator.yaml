# Preset for a machine that already has a supported accelerator (this laptop has
# an RTX 3050 Ti Laptop with 4 GiB VRAM). Only used when a local pilot supports it.
name: existing_accelerator
seed: 1337

model:
  vocab_size: auto
  d_model: 256
  encoder_layers: 4
  decoder_layers: 4
  attention_heads: 4
  ffn_dim: 1024
  dropout: 0.1
  max_positions: 512

tokenizer:
  target_vocab_size: 16000
  min_pair_frequency: 2

data:
  source: europarl_nc
  train_pairs: 150000
  max_source_tokens: 128
  max_target_tokens: 136
  max_char_ratio: 3.0
  block_size: 200

train:
  device: auto
  precision: auto             # bf16 on CUDA when the device reports support
  num_threads: 8
  peak_lr: 5.0e-4
  warmup_updates: 400
  token_budget: 4096
  max_micro_batch: 32
  max_steps: 20000
  max_train_tokens: 82000000
  max_walltime_s: 7200
  checkpoint_every: 500
  validate_every: 500
  patience: 8

eval:
  max_new_tokens: 136
  beam_size: 1
  dev_limit: 300
