# Optional larger experiment. Only run if measurements on the actual target
# show it fits the local time/memory budget.
name: compact
seed: 1337

model:
  vocab_size: auto
  d_model: 384
  encoder_layers: 4
  decoder_layers: 4
  attention_heads: 6
  ffn_dim: 1536
  dropout: 0.1
  max_positions: 512

tokenizer:
  target_vocab_size: 32000
  min_pair_frequency: 2

data:
  source: europarl_nc
  train_pairs: 400000
  max_source_tokens: 160
  max_target_tokens: 168
  max_char_ratio: 3.0
  block_size: 200

train:
  device: auto
  precision: auto
  num_threads: 8
  peak_lr: 5.0e-4
  warmup_updates: 1000
  token_budget: 8192
  max_micro_batch: 32
  max_steps: 40000
  max_train_tokens: 320000000
  max_walltime_s: 14400
  checkpoint_every: 1000
  validate_every: 1000
  patience: 10

eval:
  max_new_tokens: 168
  beam_size: 2
  dev_limit: 300
