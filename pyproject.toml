[project]
name = "transcend-nmt"
version = "0.1.0"
description = "From-scratch English<->French neural machine translation (training, export, evaluation)"
requires-python = ">=3.11"
dependencies = [
  "torch==2.14.1",
  "numpy>=2.0",
  "PyYAML==6.0.3",
  "sentencepiece==0.2.1",
  "onnx==1.20.0",
  "onnxruntime==1.31.1",
  "sacrebleu==2.5.1",
  "protobuf==6.32.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
nmt = "nmt.cli:main"

[tool.setuptools]
packages = ["nmt", "nmt.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
